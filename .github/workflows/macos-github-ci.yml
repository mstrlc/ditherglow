name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with --minversion in .swiftformat and the versions you run locally.
  SWIFTFORMAT_VERSION: 0.63.1
  SWIFTLINT_VERSION: 0.65.0
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/install-linters.sh
      - run: scripts/lint.sh

  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ci/SourcePackages
          key: spm-${{ hashFiles('Ditherglow.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - run: scripts/build.sh
